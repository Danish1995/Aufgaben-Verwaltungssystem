<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .table thead th, .table tbody td { vertical-align: middle; text-align: center; }
        .badge-role { font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container mt-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Employee Directory</h2>
        <p class="mb-0">Logged in as: <strong><span sec:authentication="name"></span></strong></p>
    </div>

    <!-- Action Buttons -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2">
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/registerUserForm}" class="btn btn-success btn-sm">
                <i class="bi bi-person-plus"></i> Add User
            </a>
            <a th:href="@{/api/tasks}" class="btn btn-primary btn-sm">
                <i class="bi bi-list-task"></i> All Tasks
            </a>
            <a th:href="@{/userProfile}" class="btn btn-secondary btn-sm">
                <i class="bi bi-person-circle"></i> My Profile
            </a>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>

    <!-- Filter Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/users}" method="get" class="row g-2 align-items-end">

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Name</label>
                    <input type="text" name="name" class="form-control form-control-sm"
                           placeholder="Search by name..." th:value="${currentName}"/>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="text" name="email" class="form-control form-control-sm"
                           placeholder="Search by email..." th:value="${currentEmail}"/>
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Role</label>
                    <select name="role" class="form-select form-select-sm">
                        <option value="">All Roles</option>
                        <option value="ADMIN"   th:selected="${currentRole == 'ADMIN'}">Admin</option>
                        <option value="MANAGER" th:selected="${currentRole == 'MANAGER'}">Manager</option>
                        <option value="MEMBER"  th:selected="${currentRole == 'MEMBER'}">Member</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Per page</label>
                    <select name="size" class="form-select form-select-sm">
                        <option value="5"  th:selected="${currentSize == 5}">5</option>
                        <option value="10" th:selected="${currentSize == 10}">10</option>
                        <option value="20" th:selected="${currentSize == 20}">20</option>
                    </select>
                </div>

                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm w-100">
                        <i class="bi bi-search"></i> Filter
                    </button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm w-100">
                        <i class="bi bi-x"></i> Clear
                    </a>
                </div>

                <input type="hidden" name="page" value="0"/>
            </form>
        </div>
    </div>

    <!-- Result count -->
    <p class="text-muted small mb-2"
       th:text="|Showing ${users.size()} of ${userPage.totalElements} users|"></p>

    <!-- Table -->
    <div class="table-responsive shadow-sm rounded bg-white p-3">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Created</th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="singleUser : ${users}">
                <td th:text="${singleUser.id}"></td>
                <td th:text="${singleUser.name}"></td>
                <td th:text="${singleUser.email}"></td>
                <td>
                    <span th:text="${singleUser.role}"
                          th:class="'badge badge-role bg-' + (${singleUser.role} == 'ADMIN' ? 'danger' : (${singleUser.role} == 'MANAGER' ? 'warning text-dark' : 'secondary'))">
                    </span>
                </td>
                <td th:text="${#temporals.format(singleUser.createdAt, 'dd MMM yyyy')}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/users/{id}(id=${singleUser.id})}"
                       class="btn btn-sm btn-primary me-1">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                    <form th:action="@{/users/delete/{id}(id=${singleUser.id})}"
                          method="post" class="d-inline">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-sm btn-danger"
                                onclick="return confirm('Delete this user?')">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="6" class="text-center text-muted py-4">No users found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${userPage.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center">

            <li class="page-item" th:classappend="${userPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users(page=${userPage.number - 1}, size=${currentSize},
                               name=${currentName}, email=${currentEmail},
                               role=${currentRole})}">
                    &laquo; Prev
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, userPage.totalPages - 1)}"
                th:classappend="${i == userPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/users(page=${i}, size=${currentSize},
                               name=${currentName}, email=${currentEmail},
                               role=${currentRole})}"
                   th:text="${i + 1}">
                </a>
            </li>

            <li class="page-item" th:classappend="${userPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users(page=${userPage.number + 1}, size=${currentSize},
                               name=${currentName}, email=${currentEmail},
                               role=${currentRole})}">
                    Next &raquo;
                </a>
            </li>

        </ul>
        <p class="text-center text-muted small"
           th:text="|Page ${userPage.number + 1} of ${userPage.totalPages}|"></p>
    </nav>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
