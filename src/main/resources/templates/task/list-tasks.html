<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Task Management</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>

        body {
            background-color: #f8f9fa;
        }

        .table thead th,
        .table tbody td {
            text-align: center;
            vertical-align: middle;
        }

        .badge-status,
        .badge-priority {
            font-size: 0.85rem;
            padding: 0.5rem 0.7rem;
        }

        .card {
            border-radius: 14px;
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
        }

        .page-link {
            border-radius: 8px !important;
            margin: 0 3px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <!-- FILTER SECTION -->
    <!-- inputs have name attributes When the user submits the form, the browser automatically builds the URL
    /api/tasks?keyword=test&status=IN_PROGRESS spring then automatically maps them to @RequestParam -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <form th:action="@{/api/tasks}" method="get">

                <div class="row g-3 align-items-end">

                    <!-- Search -->
                    <div class="col-md-3">

                        <label class="form-label fw-semibold">
                            Search
                        </label>

                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search title or description..."
                               th:value="${currentKeyword}">

                    </div>

                    <!-- Status -->
                    <div class="col-md-2">

                        <label class="form-label fw-semibold">
                            Status
                        </label>

                        <select name="status" class="form-select">

                            <option value="">All Statuses</option>

                            <option value="TODO"
                                    th:selected="${currentStatus == 'TODO'}">
                                To Do
                            </option>

                            <option value="IN_PROGRESS"
                                    th:selected="${currentStatus == 'IN_PROGRESS'}">
                                In Progress
                            </option>

                            <option value="DONE"
                                    th:selected="${currentStatus == 'DONE'}">
                                Done
                            </option>

                        </select>

                    </div>

                    <!-- Priority -->
                    <div class="col-md-2">

                        <label class="form-label fw-semibold">
                            Priority
                        </label>

                        <select name="priority" class="form-select">

                            <option value="">All Priorities</option>

                            <option value="LOW"
                                    th:selected="${currentPriority == 'LOW'}">
                                Low
                            </option>

                            <option value="MEDIUM"
                                    th:selected="${currentPriority == 'MEDIUM'}">
                                Medium
                            </option>

                            <option value="HIGH"
                                    th:selected="${currentPriority == 'HIGH'}">
                                High
                            </option>

                        </select>

                    </div>

                    <!-- Assigned User -->
                    <div class="col-md-3">

                        <label class="form-label fw-semibold">
                            Assigned User
                        </label>

                        <select name="assignedUserId" class="form-select">

                            <option value="">All Users</option>

                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name}"
                                    th:selected="${currentUser == user.id}">
                            </option>

                        </select>

                    </div>

                    <!-- Buttons -->
                    <div class="col-md-2 d-flex gap-2">

                        <input type="hidden"
                               name="size"
                               th:value="${currentSize}"/>

                        <button type="submit"
                                class="btn btn-dark w-100">

                            <i class="bi bi-funnel-fill"></i>
                            Filter

                        </button>

                        <a th:href="@{/api/tasks}"
                           class="btn btn-outline-secondary w-100">

                            Clear

                        </a>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold">
            Task Management
        </h2>

        <p class="mb-0">
            Logged in as:
            <strong>
                <span sec:authentication="name"></span>
            </strong>
        </p>

    </div>

    <!-- TOP BUTTONS -->
    <div class="d-flex justify-content-between mb-3 flex-wrap gap-2">

        <div class="d-flex gap-2">

            <a th:href="@{/users}" class="btn btn-success">
                <i class="bi bi-arrow-left"></i>
                Back to Dashboard
            </a>

            <a th:href="@{/api/add}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i>
                Add Task
            </a>

        </div>

        <div class="d-flex gap-2">

            <a th:href="@{/userProfile}" class="btn btn-primary">
                <i class="bi bi-person-circle"></i>
                My Profile
            </a>

            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-danger">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </button>
            </form>

        </div>

    </div>

    <!-- TABLE -->
    <div class="table-responsive shadow-sm rounded bg-white p-3">

        <table class="table table-hover align-middle">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Assigned User</th>
                <th>Created</th>
                <th>Updated</th>

                <th sec:authorize="hasRole('ADMIN')">
                    Actions
                </th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="task : ${tasks}">

                <td th:text="${task.id}"></td>

                <td th:text="${task.title}"></td>

                <td th:text="${task.description}"></td>

                <!-- STATUS -->
                <td>

                    <span th:text="${task.status}"
                          th:classappend="'badge badge-status bg-' +
                          (${task.status} == 'DONE' ? 'success' :
                          (${task.status} == 'IN_PROGRESS'
                          ? 'warning text-dark'
                          : 'secondary'))">

                    </span>

                </td>

                <!-- PRIORITY -->
                <td>

                    <span th:text="${task.priority}"
                          th:classappend="'badge badge-priority bg-' +
                          (${task.priority} == 'HIGH'
                          ? 'danger'
                          : (${task.priority} == 'MEDIUM'
                          ? 'warning text-dark'
                          : 'secondary'))">

                    </span>

                </td>

                <!-- DATES -->
                <td th:text="${#temporals.format(task.dueDate, 'yyyy-MM-dd HH:mm')}"></td>

                <td th:text="${task.assignedUser != null ? task.assignedUser.name : 'Unassigned'}"></td>

                <td th:text="${#temporals.format(task.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                <td th:text="${#temporals.format(task.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>

                <!-- ACTIONS -->
                <td sec:authorize="hasRole('ADMIN')">
                    <div class="d-flex justify-content-center gap-2 flex-nowrap">
                        <a th:href="@{/api/tasks/{id}(id=${task.id})}"
                           class="btn btn-sm btn-primary me-1">

                            <i class="bi bi-pencil-square"></i>
                            Edit

                        </a>

                        <form th:action="@{/api/tasks/{id}(id=${task.id})}"
                              method="post"
                              class="d-inline">

                            <input type="hidden"
                                   name="_method"
                                   value="delete"/>

                            <button class="btn btn-sm btn-danger">

                                <i class="bi bi-trash"></i>
                                Delete

                            </button>

                        </form>
                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- PAGINATION -->
    <nav th:if="${taskPage.totalPages > 1}"
         class="mt-4">

        <ul class="pagination justify-content-center">

            <!-- PREVIOUS -->
            <li class="page-item"
                th:classappend="${taskPage.first} ? 'disabled'">

                <a class="page-link"

                   th:href="@{/api/tasks(
                   page=${taskPage.number - 1},
                   size=${currentSize},
                   status=${currentStatus},
                   priority=${currentPriority},
                   assignedUserId=${currentUser},
                   keyword=${currentKeyword})}">

                    Previous

                </a>

            </li>

            <!-- PAGE NUMBERS -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, taskPage.totalPages - 1)}"
                th:classappend="${i == taskPage.number} ? 'active'">

                <a class="page-link"

                   th:href="@{/api/tasks(
                   page=${i},
                   size=${currentSize},
                   status=${currentStatus},
                   priority=${currentPriority},
                   assignedUserId=${currentUser},
                   keyword=${currentKeyword})}"

                   th:text="${i + 1}">

                </a>

            </li>

            <!-- NEXT -->
            <li class="page-item"
                th:classappend="${taskPage.last} ? 'disabled'">

                <a class="page-link"

                   th:href="@{/api/tasks(
                   page=${taskPage.number + 1},
                   size=${currentSize},
                   status=${currentStatus},
                   priority=${currentPriority},
                   assignedUserId=${currentUser},
                   keyword=${currentKeyword})}">

                    Next

                </a>

            </li>

        </ul>

    </nav>

</div>

</body>
</html>
