# Docker-specific Spring Boot configuration
# This profile is activated when running in Docker (see docker-compose.yml SPRING_PROFILES_ACTIVE=docker)

spring.application.name=TaskManager
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging in Docker (structured for container logs)
logging.level.root=INFO
logging.level.com.danish.taskmanager=DEBUG
logging.pattern.console=%d{ISO8601} %p %c{1.} %m%n

# Actuator endpoints (for health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Database connection pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

